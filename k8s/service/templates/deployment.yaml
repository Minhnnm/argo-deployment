apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-app
          image: harbor.local.com/app-test/books-shop:1.0.1   # 👈 image để test
          imagePullPolicy: Always
          ports:
            - containerPort: 80