apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: {{ .Values.namespace }}
  labels:
    app: my-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      imagePullSecrets:
        - name: harbor-secret
      containers:
        - name: my-app
          image: harbor.local.com:30002/app-test/books-shop:1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
          {{- include "common.environments" . | nindent 12 }}